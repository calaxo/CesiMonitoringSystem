persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log

# Sessions persistantes : durée de vie des sessions non-clean (0 = illimitée)
persistent_client_expiration 1d

# Nombre max de messages en file pour QoS 1/2 (sessions persistantes)
max_queued_messages 100

# MQTT classique
listener 1883
allow_anonymous true

# WebSocket pour interface web
listener 9001
protocol websockets
