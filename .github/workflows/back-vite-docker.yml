name: Build Vite, Build & Push BACK Docker image

on:
  pull_request:
    branches: [ build ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build-and-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            FRONT/package-lock.json

      - name: Install deps (Vite app)
        working-directory: hutcvite/hutc-vite-app
        run: npm ci




      - name: Build Vite assets
        working-directory: hutcvite/hutc-vite-app

        run: npm run build
        # NOTE: la sortie est configurée vers ../../BACK/assets via vite.config.js

      - name: List generated assets (debug)
        run: |
          ls -la BACK/assets || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3




      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BACK
          file: ./BACK/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image reference
        run: |
          echo "Image pushed: ${{ steps.meta.outputs.tags }}"
